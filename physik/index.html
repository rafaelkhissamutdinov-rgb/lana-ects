<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physik/Astronomie?</title>
<style>
  :root {
    --pink-1: #ffe1ef;
    --pink-2: #ffb8d9;
    --pink-3: #ff8fc4;
    --text: #7a1f4f;
    --yes: #2fb67c;
    --no: #e0475b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at 50% 35%, var(--pink-1) 0%, var(--pink-2) 60%, var(--pink-3) 100%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow: hidden;
  }

  /* floating cute animals in the background */
  #animals { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .animal {
    position: absolute;
    animation: bob var(--dur) ease-in-out var(--delay) infinite alternate;
    opacity: .85;
    user-select: none;
  }
  @keyframes bob {
    from { transform: translateY(0) rotate(-8deg); }
    to   { transform: translateY(-18px) rotate(8deg); }
  }

  .screen { display: none; position: relative; z-index: 1; width: 100%; max-width: 560px; text-align: center; }
  .screen.active { display: block; animation: fade .4s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .card {
    background: rgba(255, 255, 255, .7);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 24px;
    padding: 32px 20px;
    box-shadow: 0 10px 30px rgba(196, 60, 130, .25);
  }
  .heute { color: #e0247a; text-decoration: underline wavy #ff8fc4; text-underline-offset: 6px; }
  h1 { font-size: clamp(1.6rem, 6vw, 2.4rem); line-height: 1.25; margin: 0 0 28px; }
  .buttons { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  button {
    font: inherit;
    font-size: 1.3rem;
    font-weight: 700;
    color: #fff;
    border: 0;
    border-radius: 999px;
    padding: 14px 44px;
    cursor: pointer;
    transition: transform .12s ease, filter .12s ease;
  }
  button:hover { transform: scale(1.06); filter: brightness(1.08); }
  button:active { transform: scale(.96); }
  #btn-ja { background: var(--yes); }
  #btn-nein { background: var(--no); }

  video { display: block; width: 100%; max-height: 75vh; border-radius: 16px; background: #000; box-shadow: 0 10px 30px rgba(196, 60, 130, .35); }

  .back {
    margin-top: 20px;
    background: none;
    color: var(--text);
    font-size: .95rem;
    font-weight: 500;
    padding: 6px 12px;
    text-decoration: underline;
  }

  /* flying thumbs */
  .thumb {
    position: fixed;
    z-index: 5;
    pointer-events: none;
    line-height: 1;
    will-change: transform, opacity;
  }
</style>
</head>
<body>

<div id="animals" aria-hidden="true"></div>

<section id="frage" class="screen active">
  <div class="card">
    <h1>Hast du <span class="heute">heute</span> Physik/Astronomie geschafft?</h1>
    <div class="buttons">
      <button id="btn-ja" type="button">Ja</button>
      <button id="btn-nein" type="button">Nein</button>
    </div>
  </div>
</section>

<section id="ja" class="screen">
  <video id="video-ja" src="ja.mp4" playsinline loop controls preload="auto"></video>
  <button class="back" type="button">zurück</button>
</section>

<section id="nein" class="screen">
  <video id="video-nein" src="nein.mp4" playsinline loop controls preload="auto"></video>
  <button class="back" type="button">zurück</button>
</section>

<script>
  // background animals
  const ANIMALS = ['🐰', '🐱', '🐇', '🐈', '🐶', '🐹', '🐼', '🐨', '🦊', '🐻', '🐥', '🦄', '🐭', '🐾'];
  const layer = document.getElementById('animals');
  const count = Math.round(Math.min(28, Math.max(14, innerWidth * innerHeight / 22000)));
  for (let i = 0; i < count; i++) {
    const a = document.createElement('span');
    a.className = 'animal';
    a.textContent = ANIMALS[i % ANIMALS.length];
    a.style.left = (Math.random() * 94) + '%';
    a.style.top = (Math.random() * 94) + '%';
    a.style.fontSize = (22 + Math.random() * 26) + 'px';
    a.style.setProperty('--dur', (2 + Math.random() * 2.5) + 's');
    a.style.setProperty('--delay', (-Math.random() * 3) + 's');
    layer.appendChild(a);
  }

  // thumbs flying out of the video edges while it plays
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let thumbTimer = null;

  function spawnThumb(video, emoji) {
    const r = video.getBoundingClientRect();
    if (!r.width) return;
    // random point on the video's border
    const side = Math.floor(Math.random() * 4);
    let x, y;
    if (side === 0)      { x = r.left + Math.random() * r.width; y = r.top; }
    else if (side === 1) { x = r.right; y = r.top + Math.random() * r.height; }
    else if (side === 2) { x = r.left + Math.random() * r.width; y = r.bottom; }
    else                 { x = r.left; y = r.top + Math.random() * r.height; }
    // fly away from the video's center
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = x - cx, dy = y - cy;
    const len = Math.hypot(dx, dy) || 1;
    const dist = 120 + Math.random() * 180;
    dx = dx / len * dist; dy = dy / len * dist;

    const t = document.createElement('span');
    t.className = 'thumb';
    t.textContent = emoji;
    const size = 34 + Math.random() * 28;
    t.style.fontSize = size + 'px';
    t.style.left = (x - size / 2) + 'px';
    t.style.top = (y - size / 2) + 'px';
    document.body.appendChild(t);

    const spin = (Math.random() - .5) * 120;
    t.animate([
      { transform: 'translate(0,0) scale(.4) rotate(0deg)', opacity: 0 },
      { opacity: 1, offset: .15 },
      { transform: `translate(${dx}px, ${dy}px) scale(1.2) rotate(${spin}deg)`, opacity: 0 }
    ], { duration: 1400 + Math.random() * 800, easing: 'cubic-bezier(.2,.7,.3,1)' })
      .onfinish = () => t.remove();
  }

  function startThumbs(video, emoji) {
    stopThumbs();
    if (reduceMotion) return;
    thumbTimer = setInterval(() => {
      if (!video.paused) for (let i = 0; i < 3; i++) spawnThumb(video, emoji);
    }, 220);
  }
  function stopThumbs() {
    clearInterval(thumbTimer);
    thumbTimer = null;
  }

  // navigation
  const videos = { ja: document.getElementById('video-ja'), nein: document.getElementById('video-nein') };
  const thumbs = { ja: '👍', nein: '👎' };

  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
    for (const [key, v] of Object.entries(videos)) if (key !== id) v.pause();
    if (videos[id]) startThumbs(videos[id], thumbs[id]); else stopThumbs();
  }

  function answer(id) {
    show(id);
    history.pushState({ id }, '', '#' + id);
    const v = videos[id];
    v.currentTime = 0;
    // play() inside the click handler so the browser allows sound
    v.play().catch(() => {});
  }

  document.getElementById('btn-ja').addEventListener('click', () => answer('ja'));
  document.getElementById('btn-nein').addEventListener('click', () => answer('nein'));
  document.querySelectorAll('.back').forEach(b => b.addEventListener('click', () => history.back()));

  window.addEventListener('popstate', e => show(e.state?.id || 'frage'));
  history.replaceState({ id: 'frage' }, '', location.pathname);
</script>
</body>
</html>
