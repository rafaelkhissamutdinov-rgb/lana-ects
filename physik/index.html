<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physik heute?</title>
<style>
  :root {
    --text: #5a1a3d;
    --accent: #e0247a;
    --yes: #2fb67c;
    --no: #e0475b;
    --want: #8a5cf6;
    --bg: radial-gradient(circle at 50% 35%, #ffe1ef 0%, #ffb8d9 60%, #ff8fc4 100%);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow-x: hidden;
    background: #ffb8d9;
  }

  /* themed background with floating emoji */
  #bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: var(--bg); overflow: hidden; }
  .deco {
    position: absolute;
    animation: bob var(--dur) ease-in-out var(--delay) infinite alternate;
    opacity: .85;
    user-select: none;
    line-height: 1;
  }
  @keyframes bob {
    from { transform: translateY(0) rotate(-8deg); }
    to   { transform: translateY(-18px) rotate(8deg); }
  }

  .screen { display: none; position: relative; z-index: 1; width: 100%; max-width: 560px; text-align: center; }
  .screen.active { display: block; animation: fade .4s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .card {
    background: rgba(255, 255, 255, .78);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 24px;
    padding: 28px 20px 32px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .18);
  }

  .date { font-size: .95rem; opacity: .75; margin: 0; }
  .greeting { font-size: clamp(1.2rem, 4.5vw, 1.5rem); font-weight: 700; margin: 4px 0 18px; }
  .heute { color: var(--accent); text-decoration: underline wavy currentColor; text-underline-offset: 6px; text-decoration-thickness: 2px; }
  h1 { font-size: clamp(1.6rem, 6vw, 2.4rem); line-height: 1.25; margin: 0 0 28px; }
  h2 { font-size: clamp(1.3rem, 5vw, 1.8rem); line-height: 1.3; margin: 0 0 6px; }
  .sub { margin: 0 0 24px; opacity: .8; }

  .buttons { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  button {
    font: inherit;
    font-size: 1.3rem;
    font-weight: 700;
    color: #fff;
    border: 0;
    border-radius: 999px;
    padding: 14px 44px;
    cursor: pointer;
    transition: transform .12s ease, filter .12s ease;
  }
  button:hover { transform: scale(1.05); filter: brightness(1.08); }
  button:active { transform: scale(.96); }
  #btn-ja { background: var(--yes); }
  #btn-nein { background: var(--no); }
  #btn-will { background: var(--want); font-size: 1.15rem; padding: 12px 28px; flex-basis: 100%; max-width: 320px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .fach {
    background: #fff;
    color: var(--text);
    border: 2px solid rgba(138, 92, 246, .35);
    border-radius: 18px;
    padding: 16px 10px;
    font-size: 1.05rem;
    line-height: 1.25;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .fach .icon { font-size: 2rem; line-height: 1; }
  .fach:hover { border-color: var(--want); }

  .hilfe-icon { font-size: 3rem; line-height: 1; margin-bottom: 8px; }
  .hilfe-body { text-align: left; line-height: 1.5; margin-top: 16px; }
  .soon { text-align: center; opacity: .7; font-style: italic; }
  .hilfe-img { display: block; width: min(100%, 320px); margin: 0 auto; max-height: 55vh; object-fit: contain; border-radius: 16px; }
  .frage-zurueck { text-align: center; font-size: clamp(1.2rem, 5vw, 1.5rem); font-weight: 700; margin: 18px 0 0; }
  .wahl { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; align-items: center; }
  .wahl button { width: 100%; max-width: 320px; font-size: 1.1rem; padding: 13px 20px; }
  .wahl .go-schach { background: linear-gradient(90deg, #ffb703, #fb8500); }
  .wahl .go-tutorium { background: linear-gradient(90deg, #5b6170, #2f333d); }

  /* full-screen scenes behind the chess / tutorium videos */
  .scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; display: none; }
  .scene.on { display: block; }
  #scene-happy { background: radial-gradient(circle at 50% 20%, #fff7b0 0%, #ffd84d 30%, #7fd3ff 75%, #52b6f5 100%); }
  #scene-happy .sun {
    position: absolute; top: -90px; left: 50%; width: 260px; height: 260px; margin-left: -130px;
    border-radius: 50%; background: radial-gradient(circle, #fff6a8 0%, #ffd23f 55%, rgba(255, 210, 63, 0) 72%);
    animation: pulse 2.4s ease-in-out infinite;
  }
  #scene-happy .rainbow {
    position: absolute; bottom: -220px; left: 50%; width: 640px; height: 640px; margin-left: -320px; border-radius: 50%;
    background: radial-gradient(circle, transparent 52%, #8b5cf6 52%, #8b5cf6 56%, #3b82f6 56%, #3b82f6 60%, #22c55e 60%, #22c55e 64%,
                #facc15 64%, #facc15 68%, #fb923c 68%, #fb923c 72%, #ef4444 72%, #ef4444 76%, transparent 76%);
    opacity: .55;
  }
  @keyframes pulse { 50% { transform: scale(1.12); } }
  #scene-gloom { background: radial-gradient(ellipse at 50% 40%, #3a3f4a 0%, #1c1f26 55%, #07080b 100%); }
  #scene-gloom::after { /* heavy vignette that slowly breathes */
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(0, 0, 0, .85) 100%);
    animation: breathe 6s ease-in-out infinite;
  }
  @keyframes breathe { 50% { opacity: .55; } }
  .drop {
    position: absolute; top: -60px; width: 1px; height: 60px;
    background: linear-gradient(transparent, rgba(180, 195, 220, .5));
    animation: fall linear infinite;
  }
  @keyframes fall { to { transform: translateY(115vh); } }
  .gloom-deco {
    position: absolute; opacity: .28; filter: grayscale(1);
    animation: drift ease-in-out infinite alternate;
  }
  @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(14px, 26px); } }

  #katze canvas {
    display: block; margin: 0 auto; height: min(62vh, 520px); max-width: 100%;
    animation: hop 1.1s ease-in-out infinite;
    cursor: pointer;
  }
  @keyframes hop { 50% { transform: translateY(-14px) rotate(-2deg); } }
  /* the cat video only feeds the canvas; it stays in the DOM so phones keep decoding it */
  #video-katze { position: fixed; left: 0; top: 0; width: 2px; height: 2px; opacity: .01; pointer-events: none; }
  #video-katze.fallback { position: static; width: 100%; height: auto; opacity: 1; pointer-events: auto; }
  #opa video { filter: saturate(.55) contrast(1.05); }

  video { display: block; width: 100%; max-height: 75vh; border-radius: 16px; background: #000; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); }

  .back {
    margin-top: 18px;
    background: rgba(255, 255, 255, .85);
    color: var(--text);
    font-size: .95rem;
    font-weight: 600;
    padding: 8px 20px;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
  }

  /* flying thumbs */
  .thumb {
    position: fixed;
    z-index: 5;
    pointer-events: none;
    line-height: 1;
    will-change: transform, opacity;
  }
</style>
</head>
<body>

<div id="bg" aria-hidden="true"></div>
<div id="scene-happy" class="scene" aria-hidden="true"><div class="rainbow"></div><div class="sun"></div></div>
<div id="scene-gloom" class="scene" aria-hidden="true"></div>

<section id="frage" class="screen active">
  <div class="card">
    <p class="date" id="date"></p>
    <p class="greeting" id="greeting"></p>
    <h1>Hast du <span class="heute">heute</span> Physik/Astronomie geschafft?</h1>
    <div class="buttons">
      <button id="btn-ja" type="button">Ja</button>
      <button id="btn-nein" type="button">Nein</button>
      <button id="btn-will" type="button">Nein, aber ich will</button>
    </div>
  </div>
</section>

<section id="ja" class="screen">
  <video id="video-ja" src="ja.mp4" playsinline loop controls preload="auto"></video>
  <button class="back" type="button">zurück</button>
</section>

<section id="nein" class="screen">
  <video id="video-nein" src="nein.mp4" playsinline loop controls preload="auto"></video>
  <button class="back" type="button">zurück</button>
</section>

<section id="faecher" class="screen">
  <div class="card">
    <h2>Kein Zugang zu Astronomie – also nur Physik</h2>
    <p class="sub">Womit fangen wir an?</p>
    <div class="grid" id="grid"></div>
  </div>
  <button class="back" type="button">zurück</button>
</section>

<section id="katze" class="screen">
  <canvas id="canvas-katze" width="252" height="512" aria-label="Glückliche Katze"></canvas>
  <video id="video-katze" src="katze.mp4" playsinline loop preload="auto"></video>
  <button class="back" type="button">zurück</button>
</section>

<section id="opa" class="screen">
  <video id="video-opa" src="opa.mp4" playsinline loop controls preload="auto"></video>
  <button class="back" type="button">zurück</button>
</section>

<section id="hilfe" class="screen">
  <div class="card">
    <div class="hilfe-icon" id="hilfe-icon"></div>
    <h2 id="hilfe-title"></h2>
    <div class="hilfe-body" id="hilfe-body"></div>
  </div>
  <button class="back" type="button">zurück</button>
</section>

<script>
  // ---------- subjects: content for each option goes into `html` ----------
  const FAECHER = {
    tp2:    { icon: '⚛️', title: 'Theoretische Physik 2', html: '' },
    ana3:   { icon: '∫',  title: 'Analysis 3',            html: '' },
    labor:  { icon: '🧪', title: 'Laborpraktikum',        html: '' },
    schach: { icon: '♟️', title: 'Schach',
              html: '<img class="hilfe-img" src="schach.png" alt=""><p class="frage-zurueck">Und was ist mit dem Analysis-3-Tutorium? 🤨</p>' +
                    '<div class="wahl"><button type="button" class="go-schach" data-go="katze">Ich gehe zum Schach ♟️</button>' +
                    '<button type="button" class="go-tutorium" data-go="opa">Ich gehe zum Tutorium 📚</button></div>' },
  };

  // ---------- background theme per weekday ----------
  const THEMES = {
    tiere:   { bg: 'radial-gradient(circle at 50% 35%, #ffe1ef 0%, #ffb8d9 60%, #ff8fc4 100%)', base: '#ffb8d9',
               emoji: ['🐰', '🐱', '🐇', '🐈', '🐶', '🐹', '🐼', '🐨', '🦊', '🐻', '🐥', '🦄', '🐭', '🐾'] },
    geld:    { bg: 'linear-gradient(160deg, #e6f7ec 0%, #a9e3bf 55%, #5fbf8a 100%)', base: '#a9e3bf',
               emoji: ['💰', '💵', '💶', '💸', '📈', '📊', '📉', '💼', '🏦', '💳', '🪙', '🖥️', '📅', '🤑'] },
    physik:  { bg: 'radial-gradient(circle at 50% 30%, #2d3f8f 0%, #16205a 55%, #0a0f30 100%)', base: '#16205a',
               emoji: ['🧑‍🔬', '👩‍🔬', '👨‍🔬', '👩‍🚀', '🔭', '🔬', '⚛️', '🧪', '🧲', '🪐', '🌌', '🚀', '☄️', '🌍', '🧮', '⭐'] },
    muede:   { bg: 'linear-gradient(160deg, #f3eee7 0%, #ddd2c4 55%, #b9aa98 100%)', base: '#ddd2c4',
               emoji: ['😩', '😫', '🥱', '😮‍💨', '😵‍💫', '🫠', '😑', '😤', '🙄', '🥴', '😵', '🫥'] },
    traurig: { bg: 'linear-gradient(180deg, #e3ebf5 0%, #b5c6dc 55%, #8197b5 100%)', base: '#b5c6dc',
               emoji: ['😭', '😢', '😿', '🥺', '😞', '😔', '🥲', '😥', '💧', '☔', '🌧️', '💔'] },
    tod:     { bg: 'radial-gradient(circle at 50% 35%, #4a1f2a 0%, #2a1018 55%, #120608 100%)', base: '#2a1018',
               emoji: ['💀', '☠️', '🦴', '🤬', '🪦', '👻', '⚰️', '😈', '💢', '🔥'] },
    schlaf:  { bg: 'radial-gradient(circle at 50% 30%, #5a4fa8 0%, #352c78 55%, #1c1648 100%)', base: '#352c78',
               emoji: ['😴', '💤', '🛏️', '🛌', '🌙', '🌜', '⭐', '🥱', '🧸', '😪', '🌛', '✨'] },
    party:   { bg: 'radial-gradient(circle at 50% 35%, #ff5fae 0%, #9b2d9e 55%, #3d0d52 100%)', base: '#9b2d9e',
               emoji: ['🍺', '🍻', '🍷', '🥂', '🍾', '🍸', '🍹', '🥃', '🎉', '🪩', '🎶', '💃', '🕺', '🎊'] },
  };
  // index = Date.getDay(): 0 Sonntag … 6 Samstag; Friday picks one of two at random
  const WEEK = [['party'], ['geld'], ['physik'], ['muede'], ['traurig'], ['tiere', 'tod'], ['schlaf']];
  const TAG_PARAM = { so: 0, mo: 1, di: 2, mi: 3, do: 4, fr: 5, sa: 6 };

  const now = new Date();
  const params = new URLSearchParams(location.search);
  const day = params.get('tag') in TAG_PARAM ? TAG_PARAM[params.get('tag')] : now.getDay();
  const options = WEEK[day];
  const themeName = THEMES[params.get('thema')] ? params.get('thema') : options[Math.floor(Math.random() * options.length)];
  const theme = THEMES[themeName];

  const bg = document.getElementById('bg');
  document.documentElement.style.setProperty('--bg', theme.bg);
  document.body.style.background = theme.base;
  // positions/sizes are random on every visit, so the background never looks the same twice
  const count = Math.round(Math.min(30, Math.max(14, innerWidth * innerHeight / 21000)));
  const pool = [...theme.emoji].sort(() => Math.random() - .5);
  for (let i = 0; i < count; i++) {
    const d = document.createElement('span');
    d.className = 'deco';
    d.textContent = pool[i % pool.length];
    d.style.left = (Math.random() * 94) + '%';
    d.style.top = (Math.random() * 94) + '%';
    d.style.fontSize = (22 + Math.random() * 28) + 'px';
    d.style.setProperty('--dur', (2 + Math.random() * 2.5) + 's');
    d.style.setProperty('--delay', (-Math.random() * 3) + 's');
    bg.appendChild(d);
  }

  // ---------- date + greeting ----------
  const dateFmt = new Intl.DateTimeFormat('de-AT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const timeFmt = new Intl.DateTimeFormat('de-AT', { hour: '2-digit', minute: '2-digit' });
  function greetingFor(h) {
    if (h >= 5 && h < 11) return 'Guten Morgen! ☀️';
    if (h >= 11 && h < 18) return 'Guten Tag! 🌤️';
    if (h >= 18 && h < 23) return 'Guten Abend! 🌆';
    return 'Gute Nacht! 🌙';
  }
  function updateClock() {
    const t = new Date();
    document.getElementById('date').textContent = dateFmt.format(t) + ' · ' + timeFmt.format(t);
    document.getElementById('greeting').textContent = greetingFor(t.getHours());
  }
  updateClock();
  setInterval(updateClock, 30000);

  // ---------- subject buttons ----------
  const grid = document.getElementById('grid');
  for (const [key, f] of Object.entries(FAECHER)) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'fach';
    b.innerHTML = `<span class="icon">${f.icon}</span><span>${f.title}</span>`;
    b.addEventListener('click', () => go({ id: 'hilfe', fach: key }));
    grid.appendChild(b);
  }

  // ---------- thumbs flying out of the video edges while it plays ----------
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let thumbTimer = null;

  function spawnThumb(video, emojis) {
    const emoji = emojis[Math.floor(Math.random() * emojis.length)];
    const r = video.getBoundingClientRect();
    if (!r.width) return;
    // random point on the video's border
    const side = Math.floor(Math.random() * 4);
    let x, y;
    if (side === 0)      { x = r.left + Math.random() * r.width; y = r.top; }
    else if (side === 1) { x = r.right; y = r.top + Math.random() * r.height; }
    else if (side === 2) { x = r.left + Math.random() * r.width; y = r.bottom; }
    else                 { x = r.left; y = r.top + Math.random() * r.height; }
    // fly away from the video's center
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = x - cx, dy = y - cy;
    const len = Math.hypot(dx, dy) || 1;
    const dist = 120 + Math.random() * 180;
    dx = dx / len * dist; dy = dy / len * dist;

    const t = document.createElement('span');
    t.className = 'thumb';
    t.textContent = emoji;
    const size = 34 + Math.random() * 28;
    t.style.fontSize = size + 'px';
    t.style.left = (x - size / 2) + 'px';
    t.style.top = (y - size / 2) + 'px';
    document.body.appendChild(t);

    const spin = (Math.random() - .5) * 120;
    t.animate([
      { transform: 'translate(0,0) scale(.4) rotate(0deg)', opacity: 0 },
      { opacity: 1, offset: .15 },
      { transform: `translate(${dx}px, ${dy}px) scale(1.2) rotate(${spin}deg)`, opacity: 0 }
    ], { duration: 1400 + Math.random() * 800, easing: 'cubic-bezier(.2,.7,.3,1)' })
      .onfinish = () => t.remove();
  }

  function startThumbs(video, emojis, from = video) {
    stopThumbs();
    if (reduceMotion) return;
    thumbTimer = setInterval(() => {
      if (!video.paused) for (let i = 0; i < 3; i++) spawnThumb(from, emojis);
    }, 220);
  }
  function stopThumbs() {
    clearInterval(thumbTimer);
    thumbTimer = null;
  }

  // ---------- navigation ----------
  const videos = {
    ja: document.getElementById('video-ja'),
    nein: document.getElementById('video-nein'),
    katze: document.getElementById('video-katze'),
    opa: document.getElementById('video-opa'),
  };
  const thumbs = { ja: ['👍'], nein: ['👎'], katze: ['😄', '😁', '🥳', '🌈', '☀️', '✨', '🌻', '🎉', '💛', '🦋'] };
  const scenes = { katze: 'scene-happy', opa: 'scene-gloom' };

  // ---------- happy cat: remove the green screen on a canvas ----------
  const katzeVideo = videos.katze;
  const canvas = document.getElementById('canvas-katze');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  let katzeFrames = 0, katzeLoop = false;
  function kickKatze() {
    if (!katzeLoop) { katzeLoop = true; requestAnimationFrame(drawKatze); }
  }
  function drawKatze() {
    if (katzeVideo.paused || katzeVideo.ended || !document.getElementById('katze').classList.contains('active')) {
      katzeLoop = false;
      return;
    }
    try {
      // crop the empty green margins so the cat appears bigger
      const vw = katzeVideo.videoWidth, vh = katzeVideo.videoHeight;
      ctx.drawImage(katzeVideo, vw * .15, vh * .1, vw * .7, vh * .8, 0, 0, canvas.width, canvas.height);
      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i + 1], b = d[i + 2];
        const m = r > b ? r : b;
        const green = g - m;
        if (green > 90) d[i + 3] = 0;
        else if (green > 25) {
          d[i + 3] = 255 * (1 - (green - 25) / 65);
          d[i + 1] = m; // remove green spill on the fur edges
        } else if (green > 0) d[i + 1] = m;
      }
      ctx.putImageData(img, 0, 0);
      katzeFrames++;
    } catch (e) {
      useKatzeFallback();
      katzeLoop = false;
      return;
    }
    requestAnimationFrame(drawKatze);
  }
  function useKatzeFallback() {
    canvas.style.display = 'none';
    katzeVideo.classList.add('fallback');
  }
  katzeVideo.addEventListener('play', kickKatze);
  // if the phone refuses to hand frames to the canvas, just show the video itself
  katzeVideo.addEventListener('timeupdate', () => {
    if (katzeVideo.currentTime > 1 && katzeFrames === 0) useKatzeFallback();
  });
  canvas.addEventListener('click', () => katzeVideo.paused ? katzeVideo.play() : katzeVideo.pause());

  // ---------- gloomy scene: rain + faded anxious emoji ----------
  const gloom = document.getElementById('scene-gloom');
  for (let i = 0; i < 70; i++) {
    const r = document.createElement('div');
    r.className = 'drop';
    r.style.left = (Math.random() * 100) + '%';
    r.style.animationDuration = (0.7 + Math.random() * 0.8) + 's';
    r.style.animationDelay = (-Math.random() * 2) + 's';
    gloom.appendChild(r);
  }
  ['😰', '😟', '😔', '😶‍🌫️', '🥀', '🖤', '🌧️', '⛈️', '🕳️', '😞', '🌫️', '😓'].forEach(e => {
    const d = document.createElement('span');
    d.className = 'gloom-deco';
    d.textContent = e;
    d.style.left = (Math.random() * 90) + '%';
    d.style.top = (Math.random() * 90) + '%';
    d.style.fontSize = (26 + Math.random() * 30) + 'px';
    d.style.animationDuration = (5 + Math.random() * 5) + 's';
    gloom.appendChild(d);
  });

  // ---------- happy scene: floating happy emoji ----------
  const happy = document.getElementById('scene-happy');
  ['😄', '😁', '🥳', '🌈', '🌻', '🌼', '🎈', '✨', '😊', '🦋', '🎉', '🌞', '🍀', '😆'].forEach(e => {
    const d = document.createElement('span');
    d.className = 'deco';
    d.textContent = e;
    d.style.left = (Math.random() * 90) + '%';
    d.style.top = (10 + Math.random() * 80) + '%';
    d.style.fontSize = (26 + Math.random() * 26) + 'px';
    d.style.setProperty('--dur', (1.2 + Math.random() * 1.5) + 's');
    d.style.setProperty('--delay', (-Math.random() * 2) + 's');
    happy.appendChild(d);
  });

  function show(state) {
    const id = state.id;
    if (id === 'hilfe') {
      const f = FAECHER[state.fach];
      document.getElementById('hilfe-icon').textContent = f.icon;
      document.getElementById('hilfe-title').textContent = f.title;
      document.getElementById('hilfe-body').innerHTML = f.html || '<p class="soon">Hilfen kommen bald ✨</p>';
    }
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
    for (const [key, v] of Object.entries(videos)) if (key !== id) v.pause();
    document.querySelectorAll('.scene').forEach(sc => sc.classList.toggle('on', sc.id === scenes[id]));
    if (thumbs[id]) startThumbs(videos[id], thumbs[id], id === 'katze' && !katzeVideo.classList.contains('fallback') ? canvas : videos[id]);
    else stopThumbs();
    if (id === 'katze' && !katzeVideo.paused) kickKatze();
    scrollTo(0, 0);
  }

  function go(state) {
    show(state);
    history.pushState(state, '', '#' + (state.fach || state.id));
  }

  function answer(id) {
    go({ id });
    const v = videos[id];
    v.currentTime = 0;
    // play() inside the click handler so the browser allows sound
    v.play().catch(() => {});
  }

  document.getElementById('btn-ja').addEventListener('click', () => answer('ja'));
  document.getElementById('btn-nein').addEventListener('click', () => answer('nein'));
  document.getElementById('btn-will').addEventListener('click', () => go({ id: 'faecher' }));
  document.getElementById('hilfe-body').addEventListener('click', e => {
    const b = e.target.closest('[data-go]');
    if (b) answer(b.dataset.go);
  });
  document.querySelectorAll('.back').forEach(b => b.addEventListener('click', () => history.back()));

  window.addEventListener('popstate', e => show(e.state || { id: 'frage' }));
  history.replaceState({ id: 'frage' }, '', location.pathname + location.search);
</script>
</body>
</html>
